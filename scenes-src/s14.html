<body>
    <div id="s14-cam" data-layout-allow-overflow>
      <div id="s14-lyric"></div>
      <div class="s14-card" id="s14-a">
        <div class="s14-top"><span class="s14-ava">o</span><span><span class="s14-name">oracle-mini</span><br><span class="s14-sub">retrieval · context window</span></span>
          <span class="s14-batt"><span class="s14-cell"><span class="s14-lvl" id="s14-lvl-a"></span></span><span id="s14-pa">12%</span></span></div>
        <div class="s14-rows">
          <div class="s14-row"><span>context</span><b id="s14-ctx">3 / 12 chunks</b></div>
          <div class="s14-row"><span>status</span><span class="s14-pill" id="s14-empty">EMPTY</span></div>
        </div>
        <div id="s14-honest"></div>
      </div>
      <div class="s14-card" id="s14-b">
        <div class="s14-top"><span class="s14-ava">a</span><span><span class="s14-name">abhinav</span><br><span class="s14-sub">awake 19h 04m</span></span>
          <span class="s14-batt"><span class="s14-cell"><span class="s14-lvl" id="s14-lvl-b"></span></span><span>3%</span></span></div>
        <div class="s14-field"><span id="s14-typed"></span><span class="k-caret" id="s14-car"></span></div>
        <div class="s14-bubble" id="s14-sent">all good :)</div>
        <div class="s14-read" id="s14-read">Read 2:14 AM</div>
      </div>
    </div>
</body>
<script>
    (() => {
      const id = 's14', S = window.FILM.scenes[id], root = K.root(id), $ = s => root.querySelector(s), { vert } = K.size(root);
      const tl = gsap.timeline({ paused: true }), L = S.lines[0], w = re => L.words.find(x => re.test(x.w));
      K.push(tl, $('#s14-cam'), S.dur, 1, 1.045);

      // the oracle drains to empty and says so
      const e0 = w(/^admits/).t, e1 = w(/^empty/).t;
      K.drive(tl, 0, e1, p => {
        const n = Math.max(0, Math.round(3 * (1 - p)));
        $('#s14-ctx').textContent = `${n} / 12 chunks`;
        $('#s14-pa').textContent = `${Math.max(0, Math.round(12 * (1 - p)))}%`;
        $('#s14-lvl-a').style.width = `${Math.max(0, 1 - p) * 20}px`;
      });
      tl.fromTo($('#s14-empty'), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.18, ease: 'back.out(3)' }, e1);
      K.type(tl, $('#s14-honest'), 'says so. honestly.', e1 + 0.1, e1 + 0.45);

      // he types it, sends it, and it is read
      const g0 = w(/^say/).t, g1 = w(/good/).t, g2 = w(/good/).end;
      K.caret(tl, $('#s14-car'), 0, S.dur, 0.5);
      K.type(tl, $('#s14-typed'), 'all good :)', g0, g1 + 0.1);
      tl.set($('#s14-typed'), { opacity: 0 }, g2 + 0.05);
      tl.fromTo($('#s14-sent'), { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: 'back.out(2)' }, g2 + 0.05);
      tl.fromTo($('#s14-read'), { opacity: 0 }, { opacity: 1, duration: 0.12 }, g2 + 0.3);
      $('#s14-lvl-b').style.width = '3px';

      const key = L.words.length - 1;
      const { spans } = K.words($('#s14-lyric'), L, { key, breakBefore: vert ? [3, 5] : [5] });
      K.reveal(tl, spans, L, 'rise');

      window.__timelines[id] = tl;
    })();
</script>
