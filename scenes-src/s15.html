<script>
    (() => {
      const id = 's15', S = window.FILM.scenes[id], root = K.root(id), $ = s => root.querySelector(s), { vert } = K.size(root);
      const tl = gsap.timeline({ paused: true }), L = S.lines[0], w = re => L.words.find(x => re.test(x.w));
      K.push(tl, $('#s15-cam'), S.dur, 1, 1.04);

      // each job shrinks in beat-sized steps; you.human goes last, on "stream"
      const fmt = (mb, unit) => mb >= 1 ? `${mb.toFixed(mb >= 10 ? 0 : 1)} MB` : `${Math.round(mb * 1024)} KB`;
      const rows = [$('#s15-r1'), $('#s15-r2'), $('#s15-r4'), $('#s15-r5')], starts = [w(/^shrinking/).t, w(/^into/).t, w(/^something/).t, w(/^you$/).t];
      rows.forEach((row, i) => {
        const size = row.querySelector('.s15-size'), a = +size.dataset.from, b = +size.dataset.to, fill = row.querySelector('.s15-fill');
        const t0 = starts[i], steps = 4;
        for (let k = 1; k <= steps; k++) {
          const f = 1 - k / steps * (1 - b / a), at = t0 + (k - 1) * 0.1;
          tl.to(fill, { scaleX: Math.max(0.02, f), duration: 0.09, ease: 'power3.out' }, at);
        }
        K.count(tl, size, a, b, t0, t0 + 0.4, v => fmt(v), 'power3.out');
      });
      const st = w(/^stream/).t;
      tl.to($('#s15-r3 .s15-fill'), { scaleX: 0.04, duration: 0.16, ease: 'power4.in' }, st);
      K.drive(tl, st, st + 0.16, p => { $('#s15-you').textContent = p < 1 ? '∞' : '128 kbps'; });
      K.shake(tl, $('#s15-cam'), st + 0.16, 8, 3);

      const key = L.words.findIndex(x => /^shrinking/.test(x.w));
      const { spans } = K.words($('#s15-lyric'), L, { key, breakBefore: vert ? [3, 5] : [4] });
      K.reveal(tl, spans, L, 'rise');

      window.__timelines[id] = tl;
    })();
</script>
