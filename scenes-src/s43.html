<scene look="phosphor-deck-77025c">
<!-- c2_5 "You can shrink me for the server": the ops console from chorus 1 as a mission deck, and this time it refuses.
     The cursor presses SHRINK on "shrink"; instead the KEEP button bursts into confetti, the console answers "request
     denied: you", SHRINK greys out, and on "server" the server gives up: fine. keep it. -->
<style>
    .s43-deck { position: absolute; background: var(--k-surface); border: 2px solid var(--k-line); border-radius: var(--k-radius); color: var(--k-on-surface); }
    .s43-h { display: flex; justify-content: space-between; padding: 0.7em 0.9em; border-bottom: 2px solid var(--k-line); font: 500 0.7em/1 var(--k-font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--k-muted); white-space: nowrap; }
    .s43-h b { color: var(--k-accent-t); font-weight: 500; }
    .s43-file { display: flex; align-items: center; gap: 0.7em; padding: 1em 0.9em 0; font: 600 1em/1.2 var(--k-font-body); white-space: nowrap; }
    .s43-file span { display: block; font: 400 0.75em/1.3 var(--k-font-mono); color: var(--k-muted); }
    .s43-btn { position: absolute; display: grid; place-items: center; border-radius: calc(var(--k-radius) * 0.6); font: 700 0.95em/1 var(--k-font-display); letter-spacing: 0.1em; }
    #s43-shrink { border: 3px solid var(--k-accent-3); color: var(--k-accent-3-t); }
    #s43-shrink.off { border-color: var(--k-line); color: var(--k-muted); }
    #s43-keep { background: var(--k-accent); color: var(--k-on-accent); }
    #s43-fx { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    #s43-log { padding: 0.8em 0.9em; font: 400 0.8em/1.5 var(--k-font-mono); white-space: pre; }
    #s43-log .no { color: var(--k-accent-3-t); }
    #s43-log .ok { color: var(--k-accent-t); }
    #s43-log .dim { color: var(--k-muted); }
    #s43-lyric { position: absolute; font: 700 1em/0.98 var(--k-font-body); letter-spacing: 0.01em; text-transform: uppercase; color: var(--k-ink); }
</style>
<style frame="wide">
    #s43-ctl { left: 80px; top: 110px; width: 760px; height: 880px; font-size: 34px; }
    .s43-btn { width: 300px; height: 150px; top: 520px; }
    #s43-shrink { left: 60px; } #s43-keep { left: 400px; }
    #s43-con { left: 880px; top: 110px; width: 960px; height: 880px; font-size: 32px; }
    #s43-lyric { left: 34px; right: 34px; bottom: 40px; font-size: 92px; }
</style>
<style frame="vert">
    #s43-ctl { left: 48px; top: 250px; width: 984px; height: 560px; font-size: 36px; }
    .s43-h { padding-right: 100px; }
    .s43-btn { width: 330px; height: 150px; top: 330px; }
    #s43-shrink { left: 40px; } #s43-keep { left: 410px; }
    #s43-con { left: 48px; top: 830px; width: 984px; height: 880px; font-size: 32px; }
    #s43-log { padding-right: 100px; }
    #s43-lyric { left: 34px; width: 832px; top: 500px; font-size: 92px; }
</style>
<body>
    <div class="s43-deck" id="s43-ctl">
      <div class="s43-h"><span>storage deck</span><b>● armed</b></div>
      <div class="s43-file"><svg viewBox="0 0 40 48" width="1.6em" height="1.9em"><path d="M3 2 H27 L37 12 V46 H3 Z" fill="none" stroke="var(--k-ink)" stroke-width="3"/><path d="M10 30 V22 M15 34 V18 M20 32 V20 M25 36 V16 M30 30 V22" stroke="var(--k-accent)" stroke-width="3" stroke-linecap="round"/></svg><div>abhinav.wav<span>42.1 MB · every bit</span></div></div>
      <div class="s43-btn" id="s43-shrink">SHRINK</div>
      <div class="s43-btn" id="s43-keep">KEEP</div>
      <svg id="s43-fx" data-layout-ignore></svg>
    </div>
    <div class="s43-deck" id="s43-con">
      <div class="s43-h"><span>console · storage-01</span><span>ch 2</span></div>
      <div id="s43-log"></div>
      <div id="s43-lyric"></div>
    </div>
</body>
<script>
    (() => {
      const id = 's43', S = window.FILM.scenes[id], root = K.root(id), $ = s => root.querySelector(s), { vert } = K.size(root);
      const tl = gsap.timeline({ paused: true }), L = S.lines[0], at = re => L.words.find(x => re.test(x.w)).t;
      const tShrink = at(/^shrink/), tMe = at(/^me$/), tServer = at(/^server/), boom = tShrink + 0.08;

      // the cursor presses SHRINK on "shrink"
      const bs = K.pos($('#s43-shrink'), root), sx = bs.x + bs.w * 0.5, sy = bs.y + bs.h * 0.55, cur = K.cursor(root), ring = K.el('div', 'k-ring', root);
      K.glide(tl, cur, [[0, sx + 380, sy + 280], [tShrink - 0.04, sx, sy], [tServer, sx - 40, sy + 60]]);
      K.click(tl, cur, ring, tShrink, sx, sy);
      K.drive(tl, 0, S.dur, t => $('#s43-shrink').classList.toggle('off', t >= tMe), 0, S.dur);

      // KEEP bursts into confetti instead (and comes back, of course)
      const ctl = $('#s43-ctl'), fx = $('#s43-fx'), kb = K.pos($('#s43-keep'), ctl), kx = kb.x + kb.w / 2, ky = kb.y + kb.h / 2;
      fx.setAttribute('viewBox', `0 0 ${ctl.clientWidth} ${ctl.clientHeight}`);
      const r = K.rng(43), tones = ['accent', 'accent-2', 'accent-3', 'ink'];
      for (let i = 0; i < 70; i++) {
        const p = K.svg('rect', { x: kx - 7, y: ky - 4, width: 14, height: 8, fill: `var(--k-${tones[i % 4]})` }, fx);
        const ang = r() * Math.PI * 2, v = 260 + r() * 520, dx = Math.cos(ang) * v, dy = Math.sin(ang) * v * 0.8 - 160;
        gsap.set(p, { opacity: 0 });
        const t0 = boom + r() * 0.05;
        tl.set(p, { opacity: 1 }, t0);
        tl.fromTo(p, { x: 0, y: 0, rotation: 0, svgOrigin: `${kx} ${ky}` }, { x: dx, y: dy + 520, rotation: (r() - 0.5) * 900, svgOrigin: `${kx} ${ky}`, duration: 1.3 + r() * 0.5, ease: 'power1.in', immediateRender: false }, t0);
        tl.to(p, { opacity: 0, duration: 0.3 }, boom + 1.2);
      }
      tl.to($('#s43-keep'), { scale: 1.35, opacity: 0, duration: 0.08, ease: 'power2.out' }, boom);
      tl.fromTo($('#s43-keep'), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, tMe + 0.2);
      K.shake(tl, ctl, boom, 10, 4);

      // the console answers
      const log = $('#s43-log'), lines = [
        [0.08, 'dim', '> link up · storage-01'], [0.2, '', '> policy: make room'], [tShrink, '', vert ? '> shrink abhinav.wav' : '> shrink abhinav.wav --for server'],
        [tMe, 'no', 'request denied: you'], [tMe + 0.24, 'dim', '  reason: every bit is load-bearing'], [tServer, 'ok', '> server: fine. keep it.'],
      ];
      lines.forEach(([t, cls, txt]) => { const l = K.el('div', cls, log, txt); tl.fromTo(l, { opacity: 0 }, { opacity: 1, duration: K.F }, t); });

      // the line, SHRINK in the green block
      const { spans } = K.words($('#s43-lyric'), L, { key: L.words.findIndex(x => /^shrink/.test(x.w)), breakBefore: vert ? [2, 4] : [4] });
      K.reveal(tl, spans, L, 'cut');

      K.slabIn(root, tl, { dur: 0.22 });
      window.__timelines[id] = tl;
    })();
</script>
