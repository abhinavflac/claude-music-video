<scene look="servo-0c70be">
<!-- v2_8 "If you're missing the RPM, you still get to run": a chrome console gauge cluster. The RPM dial has no needle,
     just a blinking "? RPM"; the load and temperature gauges work fine. A question mark on little legs runs across the
     cluster the whole time, feet on twos, and on "run" the STILL RUNS lamp lights and the ? breaks into a sprint. -->
<style>
    #s36-dash { position: absolute; background: var(--k-surface); border: 2px solid var(--k-line); border-radius: calc(var(--k-radius) * 2); box-shadow: var(--k-shadow), inset 0 2px 0 var(--k-line); }
    #s36-dash svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .s36-tick { stroke: var(--k-muted); stroke-linecap: round; }
    .s36-num { font: 500 30px/1 var(--k-font-mono); fill: var(--k-muted); }
    .s36-cap { font: 700 26px/1 var(--k-font-display); fill: var(--k-ink); letter-spacing: 4px; }
    .s36-q { font: 900 120px/1 var(--k-font-display); fill: var(--k-accent-3); }
    .s36-small { font: 600 22px/1 var(--k-font-mono); fill: var(--k-muted); letter-spacing: 2px; }
    #s36-lamp { position: absolute; display: flex; align-items: center; gap: 0.5em; padding: 0.4em 0.8em; border: 2px solid var(--k-line); border-radius: 999px; font: 700 0.9em/1 var(--k-font-display); letter-spacing: 0.08em; color: var(--k-muted); white-space: nowrap; }
    #s36-lamp i { width: 0.8em; height: 0.8em; border-radius: 50%; background: var(--k-line); }
    #s36-lamp.on { color: var(--k-ink); border-color: var(--k-accent); box-shadow: 0 0 24px var(--k-accent); }
    #s36-lamp.on i { background: var(--k-accent); }
    #s36-lyric { position: absolute; font: 700 1em/0.95 var(--k-font-body); letter-spacing: 0.005em; text-transform: uppercase; color: var(--k-ink); }
</style>
<style frame="wide">
    #s36-lyric { left: 80px; top: 96px; width: 1760px; font-size: 118px; }
    #s36-dash { left: 80px; top: 340px; width: 1760px; height: 650px; }
    #s36-lamp { right: 50px; top: 40px; font-size: 32px; }
</style>
<style frame="vert">
    #s36-dash { left: 48px; top: 250px; width: 984px; height: 1062px; }
    #s36-lamp { left: 40px; top: 36px; font-size: 32px; }
    #s36-lyric { left: 48px; top: 1352px; width: 912px; font-size: 108px; }
</style>
<body>
    <div id="s36-dash"><svg id="s36-svg" data-layout-ignore></svg><div id="s36-lamp"><i></i>STILL RUNS</div></div>
    <div id="s36-lyric"></div>
</body>
<script>
    (() => {
      const id = 's36', S = window.FILM.scenes[id], root = K.root(id), $ = s => root.querySelector(s), { vert } = K.size(root), F = K.F;
      const tl = gsap.timeline({ paused: true }), L = S.lines[0], at = re => L.words.find(x => re.test(x.w)).t;
      const tMissing = at(/^missing/), tRPM = at(/^RPM/), tRun = at(/^run/);
      const dash = $('#s36-dash'), DW = dash.clientWidth, DH = dash.clientHeight, sv = $('#s36-svg');
      sv.setAttribute('viewBox', `0 0 ${DW} ${DH}`);

      // a round gauge: 270 degrees of ticks, numbers, a caption, and (optionally) a needle
      const gauge = (cx, cy, R, max, step, cap, needle) => {
        const g = K.svg('g', {}, sv), a = v => (135 + 270 * v / max) * Math.PI / 180;
        K.svg('circle', { cx, cy, r: R + 16, fill: 'var(--k-paper)', stroke: 'var(--k-line)', 'stroke-width': 4 }, g);
        for (let v = 0; v <= max + 1e-6; v += step / 5) {
          const major = Math.abs(v / step - Math.round(v / step)) < 1e-6, r0 = major ? R - 30 : R - 16;
          K.svg('line', { x1: cx + Math.cos(a(v)) * r0, y1: cy + Math.sin(a(v)) * r0, x2: cx + Math.cos(a(v)) * R, y2: cy + Math.sin(a(v)) * R, class: 's36-tick', 'stroke-width': major ? 5 : 2.5 }, g);
          if (major) { const n = K.svg('text', { x: cx + Math.cos(a(v)) * (R - 62), y: cy + Math.sin(a(v)) * (R - 62) + 10, 'text-anchor': 'middle', class: 's36-num' }, g); n.textContent = String(Math.round(v / (max > 100 ? 1000 : 1))); }
        }
        const c = K.svg('text', { x: cx, y: cy + R * 0.62, 'text-anchor': 'middle', class: 's36-cap' }, g); c.textContent = cap;
        if (!needle) return { g, a, R };
        const n = K.svg('line', { x1: cx, y1: cy, x2: cx + R - 40, y2: cy, stroke: 'var(--k-accent-2)', 'stroke-width': 7, 'stroke-linecap': 'round' }, g);
        K.svg('circle', { cx, cy, r: 16, fill: 'var(--k-accent-2)' }, g);
        return { g, a, n, cx, cy, R };
      };
      const [rx, ry, rr] = vert ? [DW / 2, 440, 280] : [DW * 0.3, DH * 0.53, 250];
      const rpm = gauge(rx, ry, rr, 8000, 1000, 'RPM ×1000');
      const q = K.svg('text', { x: rx, y: ry + 40, 'text-anchor': 'middle', class: 's36-q' }, sv); q.textContent = '?';
      const unk = K.svg('text', { x: rx, y: ry + 92, 'text-anchor': 'middle', class: 's36-small' }, sv); unk.textContent = 'NO SIGNAL';
      const small = vert ? [[DW * 0.27, 880, 100], [DW * 0.73, 880, 100]] : [[DW * 0.66, DH * 0.53, 170], [DW * 0.87, DH * 0.53, 130]];
      const load = gauge(...small[0], 100, 25, 'LOAD %', true), temp = gauge(...small[1], 120, 40, 'TEMP °C', true);
      K.drive(tl, 0, S.dur, t => {
        const lv = 62 + 8 * Math.sin(t * 5.1) + 4 * Math.sin(t * 13), tv = 71 + 2 * Math.sin(t * 2.2);
        [[load, lv], [temp, tv]].forEach(([G, v]) => { const ang = G.a(v); G.n.setAttribute('x2', (G.cx + Math.cos(ang) * (G.R - 40)).toFixed(1)); G.n.setAttribute('y2', (G.cy + Math.sin(ang) * (G.R - 40)).toFixed(1)); });
        q.style.opacity = Math.floor(t * 4) % 2 ? 0.35 : 1;
      }, 0, S.dur);
      tl.fromTo(q, { scale: 1.5, svgOrigin: `${rx} ${ry}` }, { scale: 1, svgOrigin: `${rx} ${ry}`, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, tRPM);

      // the runner: a question mark with legs, crossing the cluster on twos; it sprints once it is told it can run
      const run = K.svg('g', {}, sv), body = K.svg('text', { x: 0, y: 0, 'text-anchor': 'middle', class: 's36-q', style: 'font-size: 96px' }, run); body.textContent = '?';
      const legs = [K.svg('path', { fill: 'none', stroke: 'var(--k-accent-3)', 'stroke-width': 8, 'stroke-linecap': 'round' }, run), K.svg('path', { fill: 'none', stroke: 'var(--k-accent-3)', 'stroke-width': 8, 'stroke-linecap': 'round' }, run)];
      const ly = vert ? 1030 : DH - 64, x0 = -80, x1 = DW + 80;
      K.drive(tl, 0, S.dur, t => {
        const slow = Math.min(t, tRun), fast = Math.max(0, t - tRun), x = x0 + slow * (DW * 0.72 / tRun) + fast * DW * 1.2;
        const step = Math.floor(t * 15) % 2, stride = t < tRun ? 16 : 26;
        run.setAttribute('transform', `translate(${Math.min(x, x1 + 400).toFixed(1)} ${(ly - (step ? 6 : 0)).toFixed(1)})`);
        legs[0].setAttribute('d', `M-6 6 L${-6 - (step ? stride : -stride / 2)} 40`);
        legs[1].setAttribute('d', `M8 6 L${8 + (step ? -stride / 2 : stride)} 40`);
      }, 0, S.dur);

      // STILL RUNS lights on "run"
      K.drive(tl, 0, S.dur, t => $('#s36-lamp').classList.toggle('on', t >= tRun), 0, S.dur);
      tl.fromTo($('#s36-lamp'), { scale: 1.2 }, { scale: 1, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, tRun);

      // the line, RUN in the cyan block
      const { spans } = K.words($('#s36-lyric'), L, { key: L.words.length - 1, breakBefore: vert ? [3, 7] : [5] });
      K.reveal(tl, spans, L, 'rise');

      K.slabIn(root, tl, { dur: 0.24 });
      window.__timelines[id] = tl;
    })();
</script>
