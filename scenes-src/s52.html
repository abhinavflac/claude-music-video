<scene look="citron-counter-67eac0">
<!-- br_2 "Thought a hundred times about a chair, zero times for you": a premium cart, two orders. The ergonomic chair has
     been in the cart for 94 days; its "times considered" tallies up to 100 through the line and lands on "chair", Buy
     still greyed. On "zero" the other order drops in: sent 5,000 rupees to a friend, times considered 0, done instantly,
     ticked on "you". -->
<style>
    #s52-cart { position: absolute; background: var(--k-surface); border: 1px solid var(--k-line); border-radius: var(--k-radius); box-shadow: var(--k-shadow); color: var(--k-on-surface); }
    .s52-h { display: flex; justify-content: space-between; align-items: baseline; padding: 0.8em 1em; border-bottom: 1px solid var(--k-line); white-space: nowrap; }
    .s52-h b { font: 700 1.2em/1 var(--k-font-display); letter-spacing: -0.02em; }
    .s52-h span { font: 400 0.7em/1 var(--k-font-mono); color: var(--k-muted); }
    .s52-item { display: grid; grid-template-columns: 4.6em 1fr; column-gap: 0.9em; padding: 1em; border-bottom: 1px solid var(--k-line); }
    .s52-thumb { width: 4.6em; height: 4.6em; border-radius: calc(var(--k-radius) * 0.7); background: var(--k-paper); border: 1px solid var(--k-line); display: grid; place-items: center; }
    .s52-thumb svg { width: 3.2em; height: 3.2em; fill: none; stroke: var(--k-ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .s52-name { font: 600 1em/1.2 var(--k-font-display); letter-spacing: -0.01em; white-space: nowrap; }
    .s52-meta { margin-top: 0.3em; font: 400 0.72em/1.5 var(--k-font-mono); color: var(--k-muted); white-space: nowrap; }
    .s52-meta b { color: var(--k-ink); font-weight: 600; font-variant-numeric: tabular-nums; }
    .s52-row { display: flex; align-items: center; gap: 0.7em; margin-top: 0.6em; }
    .s52-btn { padding: 0.45em 1.2em; border-radius: 999px; font: 600 0.75em/1 var(--k-font-body); white-space: nowrap; }
    .s52-btn.off { background: var(--k-paper); border: 1px solid var(--k-line); color: var(--k-muted); }
    .s52-btn.done { background: var(--k-accent); color: var(--k-on-accent); display: flex; align-items: center; gap: 0.4em; }
    .s52-btn.done svg { width: 1em; height: 1em; }
    #s52-b { opacity: 0; }
    #s52-cart { display: flex; flex-direction: column; }
    .s52-sum { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding: 0.9em 1em; border-top: 1px solid var(--k-line); font: 400 0.8em/1 var(--k-font-mono); white-space: nowrap; }
    .s52-sum b { font: 700 1.2em/1 var(--k-font-display); }
    .s52-check { padding: 0.55em 1.3em; border-radius: 999px; background: var(--k-paper); border: 1px solid var(--k-line); color: var(--k-muted); font: 600 0.9em/1 var(--k-font-body); }
    #s52-lyric { position: absolute; font: 700 1em/0.98 var(--k-font-display); letter-spacing: -0.035em; color: var(--k-ink); }
</style>
<style frame="wide">
    #s52-cart { left: 80px; top: 110px; width: 1080px; height: 880px; font-size: 34px; }
    #s52-lyric { left: 1210px; top: 150px; width: 640px; font-size: 104px; }
</style>
<style frame="vert">
    #s52-cart { left: 48px; top: 250px; width: 984px; height: 1062px; font-size: 38px; }
    .s52-h, .s52-item, .s52-sum { padding-right: 100px; }
    #s52-lyric { left: 48px; top: 1352px; width: 912px; font-size: 84px; }
</style>
<body>
    <div id="s52-cart">
      <div class="s52-h"><b>Your cart</b><span>2 orders</span></div>
      <div class="s52-item">
        <div class="s52-thumb"><svg viewBox="0 0 24 24"><path d="M8 3 h8 a2 2 0 0 1 2 2 v7 h-12 v-7 a2 2 0 0 1 2 -2 Z M5 12 h14 v2 h-14 Z M12 14 v4 M7 21 l5 -3 l5 3 M12 18 v3"/></svg></div>
        <div><div class="s52-name">Ergonomic chair, mesh, lumbar</div>
          <div class="s52-meta">in cart for <b>94 days</b><br>times considered: <b id="s52-n">1</b></div>
          <div class="s52-row"><span class="s52-btn off">Buy · ₹18,990</span><span class="s52-meta" style="margin:0">save for later</span></div></div>
      </div>
      <div class="s52-item" id="s52-b">
        <div class="s52-thumb"><svg viewBox="0 0 24 24"><path d="M4 12 h13 M12 6 l6 6 l-6 6"/></svg></div>
        <div><div class="s52-name">Sent ₹5,000 to a friend</div>
          <div class="s52-meta">"need anything? here." <br>times considered: <b id="s52-z">0</b></div>
          <div class="s52-row"><span class="s52-btn done" id="s52-done"><svg viewBox="0 0 16 16"><path d="M3 8.5 l3 3 L13 4.5" fill="none" stroke="var(--k-on-accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>done instantly</span></div></div>
      </div>
      <div class="s52-sum"><span>subtotal, still not bought</span><b>₹18,990</b><span class="s52-check">Checkout</span></div>
    </div>
    <div id="s52-lyric"></div>
</body>
<script>
    (() => {
      const id = 's52', S = window.FILM.scenes[id], root = K.root(id), $ = s => root.querySelector(s), { vert } = K.size(root);
      const tl = gsap.timeline({ paused: true }), L = S.lines[0], at = re => L.words.find(x => re.test(x.w)).t;
      const tHundred = at(/^hundred/), tChair = at(/^chair/), tZero = at(/^zero/), tYou = at(/^you/);

      // the chair's tally climbs to 100, landing on "chair"
      K.drive(tl, 0, S.dur, t => { const p = Math.max(0, Math.min(1, (t - tHundred) / (tChair - tHundred))); $('#s52-n').textContent = String(Math.max(1, Math.round(p ** 1.4 * 100))); }, 0, S.dur);
      tl.fromTo($('#s52-n'), { scale: 1.5 }, { scale: 1, duration: 0.25, ease: 'back.out(3)', immediateRender: false }, tChair);

      // the other order, instant: in on "zero", its 0 popping, ticked on "you"
      tl.fromTo($('#s52-b'), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power3.out' }, tZero);
      tl.fromTo($('#s52-z'), { scale: 2 }, { scale: 1, duration: 0.25, ease: 'back.out(3)', immediateRender: false }, tZero + 0.1);
      tl.fromTo($('#s52-done'), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: 'back.out(3)' }, tYou);

      // the line, ZERO in the lime block
      const { spans } = K.words($('#s52-lyric'), L, { key: L.words.findIndex(x => /^zero/.test(x.w)), breakBefore: vert ? [3, 7] : [2, 4, 7, 9] });
      K.reveal(tl, spans, L, 'rise');

      K.slabIn(root, tl, { dur: 0.22 });
      window.__timelines[id] = tl;
    })();
</script>
