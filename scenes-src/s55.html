<scene look="knockout-7217c8">
<!-- fc_1 "Don't compress me": the third vise, knockout type on ink-black stock. DON'T / COMPRESS / ME are knocked out of a
     red slab; the steel jaws close in on "compress" and on the downbeat they shatter into shards that fly off the frame.
     ME slams in on its word. -->
<style>
    #s55-slab { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--k-accent); }
    #s55-words { font: 400 1em/0.9 var(--k-font-display); text-transform: uppercase; letter-spacing: 0.005em; color: oklch(from var(--k-accent) clamp(0, (0.62 - l) * 1000, 1) 0 0); text-align: center; white-space: nowrap; }
    #s55-words { --k-key-bg: var(--k-paper); }
    #s55-words .k-key { color: var(--k-accent-t); }
    .s55-jaw { position: absolute; overflow: visible; }
    .s55-shard { fill: var(--k-muted); stroke: var(--k-paper); stroke-width: 3; stroke-linejoin: bevel; }
</style>
<style frame="wide">
    #s55-slab { left: 300px; top: 120px; width: 1320px; height: 840px; }
    #s55-words { font-size: 250px; }
    .s55-jaw { top: 100px; width: 520px; height: 880px; }
    #s55-jl { left: -40px; } #s55-jr { right: -40px; }
</style>
<style frame="vert">
    #s55-slab { left: 48px; top: 360px; width: 984px; height: 1260px; }
    #s55-words { font-size: 230px; }
    .s55-jaw { top: 340px; width: 380px; height: 1300px; }
    #s55-jl { left: -120px; } #s55-jr { right: -120px; }
</style>
<body>
    <div id="s55-slab"><div id="s55-words"></div></div>
    <svg class="s55-jaw" id="s55-jl" data-bleed data-layout-ignore></svg>
    <svg class="s55-jaw" id="s55-jr" data-bleed data-layout-ignore></svg>
</body>
<script>
    (() => {
      const id = 's55', S = window.FILM.scenes[id], root = K.root(id), $ = s => root.querySelector(s), { vert } = K.size(root);
      const tl = gsap.timeline({ paused: true }), L = S.lines[0], at = re => L.words.find(x => re.test(x.w)).t;
      const tC = at(/^compress/), tMe = at(/^me$/), d = S.downbeats[0] ?? (tC + tMe) / 2;

      // the words knocked out of the slab, ME in the black block
      const words = $('#s55-words'), { spans } = K.words(words, L, { key: L.words.length - 1, breakBefore: [1, 2] });
      spans.forEach(s => s.setAttribute('data-layout-allow-occlusion', ''));   // the jaws cover them, by design
      K.reveal(tl, spans, L, 'slam');

      // each jaw is a plate pre-cut into triangles, so it can shatter
      const r = K.rng(55), jaws = [[$('#s55-jl'), -1], [$('#s55-jr'), 1]].map(([svg, side]) => {
        const jw = svg.clientWidth, jh = svg.clientHeight, cols = 4, rows = 7, shards = [];
        svg.setAttribute('viewBox', `0 0 ${jw} ${jh}`);
        const P = [...Array(rows + 1)].map((_, j) => [...Array(cols + 1)].map((_, i) => [i / cols * jw + (i % cols && j % rows ? (r() - 0.5) * jw / cols * 0.5 : 0), j / rows * jh + (i % cols && j % rows ? (r() - 0.5) * jh / rows * 0.5 : 0)]));
        for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
          const a = P[j][i], b = P[j][i + 1], c = P[j + 1][i + 1], e = P[j + 1][i];
          [[a, b, c], [a, c, e]].forEach(tri => { const s = K.svg('path', { d: 'M' + tri.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L') + ' Z', class: 's55-shard' }, svg); shards.push([s, tri]); });
        }
        return { svg, side, shards };
      });
      const inX = vert ? 150 : 250, offX = vert ? 600 : 900;
      jaws.forEach(({ svg, side, shards }) => {
        tl.fromTo(svg, { x: side * offX }, { x: 0, duration: tC + 0.001, ease: 'none' }, 0);
        tl.to(svg, { x: -side * inX, duration: d - tC, ease: 'power3.in' }, tC);
        shards.forEach(([s, tri]) => {
          const cx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3, cy = (tri[0][1] + tri[1][1] + tri[2][1]) / 3;
          tl.to(s, { x: side * (300 + r() * 900), y: (r() - 0.35) * 900, rotation: (r() - 0.5) * 540, svgOrigin: `${cx} ${cy}`, opacity: 0, duration: 0.55 + r() * 0.3, ease: 'power2.out' }, d + r() * 0.03);
        });
      });
      tl.to(words, { scaleX: 0.6, duration: d - tC, ease: 'power3.in' }, tC);
      tl.to(words, { scaleX: 1, duration: 0.3, ease: 'elastic.out(1.2, 0.45)' }, d + 0.02);
      K.shake(tl, $('#s55-slab'), d, 16, 4);
      K.flash(tl, K.flashLayer(root, true), d, 1, 0.5);

      K.slabIn(root, tl, { dur: 0.2 });
      window.__timelines[id] = tl;
    })();
</script>
