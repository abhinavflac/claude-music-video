<script>
    (() => {
      const id = 's59', S = window.FILM.scenes[id], root = K.root(id), $ = s => root.querySelector(s), { vert } = K.size(root);
      const tl = gsap.timeline({ paused: true }), L = S.lines[0], at = re => L.words.find(x => re.test(x.w)).t;
      const tChair = at(/^chair/), tMon = at(/^monitor/), tHurts = at(/^hurts/), tBit = at(/^bit/);

      // the three boxes tick on their words
      [[0, tChair], [1, tMon], [2, tHurts]].forEach(([i, t]) => { const c = K.check($('#s59-i' + i), false); $('#s59-i' + i).prepend(c.el); K.tick(tl, c, t, 0.2); tl.fromTo($('#s59-i' + i), { x: 0 }, { x: 10, duration: 0.08, yoyo: true, repeat: 1, ease: 'power2.out', immediateRender: false }, t); });
      K.slam(tl, $('#s59-stamp'), tMon + 0.4, -10, 2.4);
      K.shake(tl, $('#s59-page'), tMon + 0.55, 6, 3);

      // the message goes out on "bit"
      tl.fromTo($('#s59-msg'), { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.25, ease: 'back.out(2)' }, tBit);

      // the line, HURTS in the pink block
      const { spans } = K.words($('#s59-lyric'), L, { key: L.words.findIndex(x => /^hurts/.test(x.w)), breakBefore: vert ? [3, 6] : [3, 6, 9] });
      K.reveal(tl, spans, L, 'rise');

      K.slabIn(root, tl, { dur: 0.28 });
      window.__timelines[id] = tl;
    })();
</script>
