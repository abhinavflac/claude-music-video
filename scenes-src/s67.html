<scene look="tachikiri-378e82">
<!-- End card, in the film's own look (the chrome's Tachikiri): koma panels and one phosphor signal. LOSSLESS slams in
     letter by letter; a single green signal line runs under it, a pulse crossing on every downbeat; the story comes back
     as four koma (noticed, the ceiling, the gift, really this time); the credits land on the downbeats; the pill above
     has already reached encoded, 0 bits lost. The card goes dark over the last second. -->
<style>
    #s67-title { position: absolute; left: 0; right: 0; display: flex; justify-content: center; font: 400 1em/1 var(--k-font-display); letter-spacing: 0.02em; color: var(--k-ink); }
    #s67-title span { display: inline-block; opacity: 0; }
    #s67-sig { position: absolute; left: 0; width: 100%; overflow: visible; }
    .s67-koma { position: absolute; overflow: hidden; border: 5px solid var(--k-accent); background: var(--k-surface); opacity: 0; }
    #s67-cred { position: absolute; left: 0; right: 0; display: grid; justify-items: center; gap: 0.5em; font: 400 1em/1.2 var(--k-font-mono); color: var(--k-muted); text-align: center; }
    #s67-cred div { opacity: 0; }
    #s67-cred .url { font: 400 2.2em/1 var(--k-font-display); letter-spacing: 0.04em; color: var(--k-accent-t); }
    #s67-black { position: absolute; inset: 0; background: var(--k-paper); opacity: 0; }
</style>
<style frame="wide">

    #s67-k0 { left: 204px; } #s67-k1 { left: 588px; } #s67-k2 { left: 972px; } #s67-k3 { left: 1356px; }

<style frame="vert">

    #s67-k0 { left: 48px; top: 780px; } #s67-k1 { left: 552px; top: 780px; } #s67-k2 { left: 48px; top: 1060px; } #s67-k3 { left: 552px; top: 1060px; }
    .s67-koma { width: 480px; height: 260px; }
    #s67-cred { top: 1370px; font-size: 32px; padding: 0 100px 0 48px; }
    #s67-cred .url { font-size: 76px; }
</style>
<body>
    <div id="s67-title"></div>
    <svg id="s67-sig" data-layout-ignore></svg>
    <div class="s67-koma" id="s67-k0"></div><div class="s67-koma" id="s67-k1"></div><div class="s67-koma" id="s67-k2"></div><div class="s67-koma" id="s67-k3"></div>
    <div id="s67-cred"><div>lyrics: Claude · music: Suno</div><div>every frame is JavaScript</div><div class="url">abhinavflac.dev</div></div>
    <div id="s67-black"></div>
</body>
<script>
    (() => {
      const id = 's67', S = window.FILM.scenes[id], root = K.root(id), $ = s => root.querySelector(s), { W, vert } = K.size(root);
      const tl = gsap.timeline({ paused: true }), D = S.downbeats, inks = [K.tok(root, 'ink'), K.tok(root, 'paper')];

      // LOSSLESS, letter by letter
      [...'LOSSLESS'].forEach((c, i) => {
        const s = K.el('span', '', $('#s67-title'), c);
        tl.set(s, { opacity: 1 }, 0.3 + i * 0.06);
        tl.fromTo(s, { y: -40, scale: 1.25 }, { y: 0, scale: 1, duration: 0.14, ease: 'power4.in', immediateRender: false }, 0.3 + i * 0.06);
      });

      const letters = [...$('#s67-title').children];
      K.fit(tl, S.dur, $('#s67-title'), () => letters.reduce((a, s) => a + s.offsetWidth, 0), vert ? 960 : 1500, '50% 0');

      // one phosphor signal: a flat green line with a pulse crossing it on every downbeat
      const sv = $('#s67-sig'), SH = 90; sv.setAttribute('viewBox', `0 0 ${W} ${SH}`);
      const x0 = vert ? 48 : 160, x1 = W - (vert ? 48 : 160);
      // the glow's region in user units: a flat line has a zero-height box, and a box-relative region would vanish with it
      const glow = K.svg('filter', { id: 's67-glow', filterUnits: 'userSpaceOnUse', x: 0, y: 0, width: W, height: SH }, K.svg('defs', {}, sv));
      K.svg('feGaussianBlur', { stdDeviation: 5, result: 'b' }, glow);
      const mg = K.svg('feMerge', {}, glow); K.svg('feMergeNode', { in: 'b' }, mg); K.svg('feMergeNode', { in: 'SourceGraphic' }, mg);
      const line = K.svg('path', { fill: 'none', stroke: 'var(--k-accent)', 'stroke-width': 4, 'stroke-linejoin': 'round', filter: 'url(#s67-glow)' }, sv);
      K.drive(tl, 0, S.dur, t => {
        const on = Math.min(1, Math.max(0, (t - D[0] + 0.4) / 0.4));
        const beat = D.filter(d => d <= t).pop(), p = beat == null ? -1 : (t - beat) / 1.2, px = x0 + p * (x1 - x0);
        let d = '';
        for (let i = 0; i <= 160; i++) {
          const x = x0 + (x1 - x0) * i / 160, k = p >= 0 && p <= 1 ? Math.exp(-(((x - px) / 26) ** 2)) : 0;
          d += `${i ? 'L' : 'M'}${x.toFixed(1)} ${(SH / 2 - k * 34 * Math.sin((x - px) / 7)).toFixed(1)} `;
        }
        line.setAttribute('d', d); line.style.opacity = on.toFixed(3);
      }, 0, S.dur);

      // the story in four koma: noticed, the ceiling, the gift, really this time
      [['s05-eye-open', '900 420 1000 640'], ['s38-ceiling', '560 180 1300 830'], ['s54-chair-gift', '1000 150 1900 1215'], ['s66-to-camera', '980 180 1000 640']].forEach(([art, vb], i) => {
        const k = $('#s67-k' + i); K.shot(k, art, { viewBox: vb, inks });
        tl.fromTo(k, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out' }, (D[1] ?? 3.9) + i * 0.25);
      });

      // the credits on the downbeats
      const credT = [D[2] ?? 6.6, (D[2] ?? 6.6) + 1.3, D[3] ?? 9.2];
      [...$('#s67-cred').children].forEach((c, i) => tl.fromTo(c, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, credT[i]));

      // and dark
      tl.fromTo($('#s67-black'), { opacity: 0 }, { opacity: 1, duration: 0.9, ease: 'power1.in' }, S.dur - 1.05);

      K.slabIn(root, tl, { dur: 0.3 });
      window.__timelines[id] = tl;
    })();
</script>
