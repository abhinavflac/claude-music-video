<!-- v1_3 "Wires in my ears, a FLAC on loop, the one thing I trust": an after-hours hi-fi player. The album art is a
     Plainclothes panel of him, eyes shut, IEMs in, inked in the player's own warm black and cream, with cue marks at its
     corners. The seek bar shows the film's real position in the song. FLAC lights on "FLAC", the loop counter ticks
     1,337 to 1,338 on "loop", the trust meter slams full on "trust". The line sits in the synced-lyrics pane. -->
<style>

    #s09-art { position: absolute; overflow: hidden; border: 2px solid var(--k-line); border-radius: calc(var(--k-radius) / 2); background: var(--k-paper); }
    #s09-art-in { position: absolute; inset: 0; }
    .s09-cue { position: absolute; width: 44px; height: 44px; border: 0 solid var(--k-accent); }
    .s09-meta { font: 500 1em/1 var(--k-font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--k-muted); white-space: nowrap; }
    #s09-title { font: 600 1em/1 var(--k-font-display); letter-spacing: 0.01em; color: var(--k-ink); white-space: nowrap; }
    .s09-chips { display: flex; gap: 12px; flex-wrap: nowrap; }
    .s09-chip { padding: 0.3em 0.55em 0.25em; border: 2px solid var(--k-line); border-radius: 999px; font: 500 1em/1 var(--k-font-mono); letter-spacing: 0.04em; color: var(--k-ink); background: var(--k-surface); white-space: nowrap; }
    #s09-flac { position: relative; }
    #s09-flac i { position: absolute; inset: -2px; border-radius: inherit; background: var(--k-accent); opacity: 0; }

    #s09-seek { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px; font: 500 1em/1 var(--k-font-mono); color: var(--k-muted); font-variant-numeric: tabular-nums; }

    #s09-lyric .k-w { padding: 0 0.02em; }
    .s09-rows { display: grid; gap: 14px; font: 500 1em/1 var(--k-font-mono); color: var(--k-ink); }
    .s09-row { display: flex; align-items: center; gap: 16px; white-space: nowrap; }
    .s09-row em { font-style: normal; color: var(--k-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .s09-row b { font-weight: 600; margin-left: auto; font-variant-numeric: tabular-nums; }

<body>
    <div id="s09-cam" data-layout-allow-overflow>
      <div id="s09-art"><div id="s09-art-in"></div></div>
      <div class="s09-cue" style="border-width:4px 0 0 4px" id="s09-c1"></div><div class="s09-cue" style="border-width:4px 4px 0 0" id="s09-c2"></div>
      <div class="s09-cue" style="border-width:0 0 4px 4px" id="s09-c3"></div><div class="s09-cue" style="border-width:0 4px 4px 0" id="s09-c4"></div>
      <div id="s09-right">
        <div class="s09-meta">now playing · side a · track 01</div>
        <div id="s09-title">lossless.flac</div>
        <div class="s09-chips"><span class="s09-chip" id="s09-flac"><i></i><span>FLAC</span></span><span class="s09-chip">24-bit / 96 kHz</span><span class="s09-chip" id="s09-rep">repeat: one</span></div>
        <div id="s09-seek"><span id="s09-now">0:28</span><div class="k-bar" id="s09-bar"></div><span id="s09-len">4:08</span></div>
        <div id="s09-spec"></div>
      </div>
      <div id="s09-lyric"></div>
      <div class="s09-rows">
        <div class="s09-row"><em>loop count</em><b id="s09-loopn" data-layout-allow-occlusion><span>1,337</span><span>1,338</span></b></div>
        <div class="s09-row"><em>trust</em><div class="k-bar" id="s09-trust"></div><b id="s09-tpct">0%</b></div>
      </div>
    </div>
</body>
<script>
    (() => {
      const id = 's09', S = window.FILM.scenes[id], root = K.root(id), $ = s => root.querySelector(s), { vert } = K.size(root);
      const tl = gsap.timeline({ paused: true }), L = S.lines[0], at = re => L.words.find(x => re.test(x.w)).t;
      const tFlac = at(/^FLAC/), tLoop = at(/^loop/), tTrust = at(/^trust/);

      // the album art: the portrait inked in the player's cream on warm black, pushing in slowly, pumping on the beat
      const art = K.shot($('#s09-art-in'), 's09-album-portrait', { viewBox: vert ? '120 380 2220 1580' : '180 120 2100 2100', inks: [K.tok(root, 'ink'), K.tok(root, 'paper')] });
      K.push(tl, $('#s09-art-in'), S.dur, 1, 1.07);
      K.pulse(tl, $('#s09-art'), S.beats, 0.012, 0.25);
      // cue marks just outside its corners, snapping in
      const a = $('#s09-art'), ax = a.offsetLeft, ay = a.offsetTop, aw = a.offsetWidth, ah = a.offsetHeight, o = 16;
      [[ax - o, ay - o], [ax + aw + o - 44, ay - o], [ax - o, ay + ah + o - 44], [ax + aw + o - 44, ay + ah + o - 44]].forEach(([x, y], i) => {
        const c = $('#s09-c' + (i + 1)); gsap.set(c, { left: x, top: y });
        tl.fromTo(c, { opacity: 0, x: i % 2 ? 30 : -30, y: i < 2 ? -30 : 30 }, { opacity: 1, x: 0, y: 0, duration: 0.25, ease: 'power3.out' }, 0.04 + i * 0.03);
      });

      // the seek bar is the film's own position in the song
      const clock = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
      $('#s09-len').textContent = clock(window.FILM.duration);
      const fill = K.el('div', 'k-bar-fill', $('#s09-bar'));
      K.drive(tl, 0, S.dur, v => { $('#s09-now').textContent = clock(S.start + v); fill.style.transform = `scaleX(${((S.start + v) / window.FILM.duration).toFixed(4)})`; }, 0, S.dur);

      // a small spectrum, deterministic: each bar a sum of sines, kicked on the beat
      if (!vert) {
        const bars = Array.from({ length: 36 }, () => K.el('i', '', $('#s09-spec')));
        K.drive(tl, 0, S.dur, t => {
          const kick = Math.max(0, ...S.beats.map(b => (t >= b ? Math.exp(-(t - b) * 7) : 0)));
          bars.forEach((b, i) => { const h = 0.25 + 0.35 * Math.abs(Math.sin(t * 6.1 + i * 0.7) * Math.sin(t * 2.3 + i * 0.31)) + kick * 0.45 * Math.exp(-i / 14); b.style.height = Math.min(100, h * 100).toFixed(1) + '%'; });
        }, 0, S.dur);
      }

      // FLAC lights up on "FLAC"; the loop counter ticks and repeat spins on "loop"; trust slams full on "trust"
      tl.fromTo($('#s09-flac i'), { opacity: 0 }, { opacity: 1, duration: 0.06 }, tFlac);
      tl.fromTo($('#s09-flac'), { scale: 1.25 }, { scale: 1, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, tFlac);
      const [n0, n1] = $('#s09-loopn').children;
      gsap.set(n1, { opacity: 0 }); tl.set(n1, { opacity: 1 }, tLoop);
      tl.fromTo([n0, n1], { yPercent: 0 }, { yPercent: -100, duration: 0.18, ease: 'power3.out' }, tLoop);
      tl.set(n0, { opacity: 0 }, tLoop + 0.18);
      tl.fromTo($('#s09-rep'), { y: 0 }, { y: -8, duration: 0.09, yoyo: true, repeat: 1, ease: 'power2.out' }, tLoop);
      const tf = K.el('div', 'k-bar-fill', $('#s09-trust'));
      K.fill(tl, tf, 0, 1, tTrust, tTrust + 0.14, 'power4.in');
      K.count(tl, $('#s09-tpct'), 0, 100, tTrust, tTrust + 0.14, v => Math.round(v) + '%', 'power4.in');

      // the synced lyric: one line, the words lighting as they are sung, TRUST in the accent block
      const { spans } = K.words($('#s09-lyric'), L, { key: L.words.length - 1, breakBefore: [4, 8] });
      K.reveal(tl, spans, L, 'rise');

      K.slabIn(root, tl, { dur: 0.24 });
      window.__timelines[id] = tl;
    })();
</script>
