<scene look="phosphene-5f5cfe">
<!-- v1_2 "Flashing ROMs and cold coffee, a cursor for a friend": three night-desk widgets as cell meters. A ROM flashes,
     the mug reads 14 degrees ("cold. again."), and the only friend online is a blinking text cursor that types "hey." -->
<tokens>--k-accent-3: #FFB72E;</tokens>
<style>
    #s08-cam { position: absolute; inset: 0; }
    #s08-glow { position: absolute; inset: -80px; background: radial-gradient(ellipse at 30% 20%, var(--k-surface), transparent 60%); }
    .s08-card { position: absolute; display: flex; flex-direction: column; gap: 14px; background: var(--k-surface); border: 2px solid var(--k-line); border-radius: var(--k-radius); color: var(--k-on-surface); }
    .s08-h { display: flex; justify-content: space-between; font: 500 0.62em/1 var(--k-font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--k-muted); }
    .s08-big { font: 600 1.9em/1 var(--k-font-display); letter-spacing: -0.02em; }
    .s08-sub { font: 400 0.8em/1.3 var(--k-font-body); color: var(--k-on-surface); }
    .s08-cells { display: grid; grid-template-columns: repeat(16, 1fr); gap: 5px; height: 42px; }
    .s08-cells i { display: block; border-radius: 3px; background: var(--k-line); }
    .s08-cells i.on { background: var(--k-accent); }
    .s08-cells.cold i.on { background: var(--k-accent-2); }
    .s08-mono { font: 400 0.66em/1.3 var(--k-font-mono); color: var(--k-muted); white-space: nowrap; }
    .s08-chat { display: flex; align-items: center; gap: 16px; }
    .s08-ava { width: 1.9em; height: 1.9em; border-radius: 50%; border: 2px solid var(--k-accent-2); display: grid; place-items: center; flex: none; }
    .s08-ava .k-caret { height: 0.95em; width: 0.16em; color: var(--k-accent-2); }
    .s08-bubble { padding: 0.45em 0.8em; border-radius: 18px; border: 2px solid var(--k-accent-2); font: 500 1em/1 var(--k-font-body); min-width: 3em; min-height: 1em; }
    #s08-lyric { position: absolute; font: 600 1em/1.04 var(--k-font-display); letter-spacing: -0.025em; color: var(--k-ink); }
</style>
<style frame="wide">
    .s08-card { width: 540px; height: 390px; padding: 30px; top: 150px; font-size: 34px; justify-content: space-between; }
    #s08-c1 { left: 80px; } #s08-c2 { left: 690px; } #s08-c3 { left: 1300px; }
    #s08-lyric { left: 80px; top: 612px; width: 1760px; font-size: 104px; }
</style>
<style frame="vert">
    .s08-card { left: 48px; width: 984px; height: 318px; padding: 26px 32px; font-size: 38px; justify-content: space-between; }
    #s08-c1 { top: 270px; } #s08-c2 { top: 612px; } #s08-c3 { top: 954px; }
    #s08-lyric { left: 48px; top: 1330px; width: 984px; font-size: 92px; }
</style>
<body>
    <div id="s08-glow" data-bleed data-layout-ignore></div>
    <div id="s08-cam" data-layout-allow-overflow>
      <div class="s08-card" id="s08-c1"><div class="s08-h"><span>fastboot</span><span id="s08-st">waiting</span></div><div class="s08-sub">flashing rom_nightly_0228.img</div><div class="s08-cells" id="s08-m1"></div><div class="s08-mono" id="s08-log">sending sparse 'system' 0/7</div></div>
      <div class="s08-card" id="s08-c2"><div class="s08-h"><span>mug.temp</span><span>sensor 02</span></div><div class="s08-big" id="s08-temp">22°C</div><div class="s08-cells cold" id="s08-m2"></div><div class="s08-sub" id="s08-cold">cold. again.</div></div>
      <div class="s08-card" id="s08-c3"><div class="s08-h"><span>friends online</span><span>1</span></div><div class="s08-chat"><span class="s08-ava"><span class="k-caret" id="s08-car"></span></span><span class="s08-bubble" id="s08-hey"></span></div><div class="s08-mono">last seen: always</div></div>
      <div id="s08-lyric"></div>
    </div>
</body>
<script>
    (() => {
      const id = 's08', S = window.FILM.scenes[id], root = K.root(id), $ = s => root.querySelector(s);
      const tl = gsap.timeline({ paused: true }), L = S.lines[0], w = re => L.words.find(x => re.test(x.w));
      K.push(tl, $('#s08-cam'), S.dur, 1, 1.05);
      const cells = (el, n) => Array.from({ length: 16 }, (_, i) => K.el('i', i < n ? 'on' : '', el));

      // ROM flashing across "Flashing ROMs"
      const m1 = cells($('#s08-m1'), 0), f0 = w(/^Flashing/).t, f1 = w(/^cold/).t;
      K.drive(tl, f0, f1 + 0.2, p => {
        const n = Math.round(p * 16);
        m1.forEach((c, i) => { c.className = i < n ? 'on' : ''; });
        $('#s08-log').textContent = `sending sparse 'system' ${Math.min(7, Math.floor(p * 8))}/7`;
        $('#s08-st').textContent = p >= 1 ? 'okay' : p > 0 ? 'writing' : 'waiting';
      });
      // the mug cools on "cold coffee"
      const m2 = cells($('#s08-m2'), 9), c0 = w(/^cold/).t, c1 = w(/^coffee/).end;
      K.drive(tl, c0, c1, p => {
        const temp = Math.round(22 - p * 8), n = Math.round(9 - p * 6);
        $('#s08-temp').textContent = `${temp}°C`;
        m2.forEach((c, i) => { c.className = i < n ? 'on' : ''; });
      });
      tl.fromTo($('#s08-cold'), { opacity: 0 }, { opacity: 1, duration: 0.12 }, c1 - 0.1);
      // the only friend online: a text cursor that types "hey."
      K.caret(tl, $('#s08-car'), 0, S.dur, 0.5);
      K.type(tl, $('#s08-hey'), 'hey.', w(/^cursor/).t, w(/^friend/).t);
      tl.fromTo($('#s08-c3'), { y: 0 }, { y: -10, duration: 0.2, ease: 'power2.out' }, w(/^friend/).t);

      const key = L.words.findIndex(x => /^friend/.test(x.w));
      const { spans } = K.words($('#s08-lyric'), L, { key, breakBefore: K.size(root).vert ? [3, 5] : [5] });
      K.reveal(tl, spans, L, 'rise');

      window.__timelines[id] = tl;
    })();
</script>
