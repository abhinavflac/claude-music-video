<template>
  <style>
    #root { --k-paper: #0A0A0B; --k-surface: #0F0F11; --k-ink: #EDEAE2; --k-on-surface: #EDEAE2; --k-muted: #A3A39B; --k-line: #26262A;
      --k-accent: #7CFF9A; --k-accent-2: #F4F2EC; --k-accent-3: #E0584B; --k-on-accent: #06140A;
      --k-font-display: 'Anton', sans-serif; --k-font-body: 'Noto Sans', sans-serif; --k-font-mono: 'Kode Mono', monospace;
      --k-radius: 0px; --k-shadow: none;
      position: absolute; inset: 0; pointer-events: none; }
    #chrome-pill { position: absolute; left: 36px; top: 30px; display: flex; align-items: center; gap: 14px; height: 54px; padding: 0 24px 0 20px; border-radius: 9999px;
      background: var(--k-paper); border: 2px solid var(--k-accent-2); color: var(--k-ink); font: 500 24px/1 var(--k-font-mono); letter-spacing: 0.01em;
      overflow: hidden; transform-origin: 0 50%; font-variant-numeric: tabular-nums; white-space: nowrap; }
    #chrome-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--k-accent); flex: none; }
    #chrome-cursor { display: inline-block; width: 12px; height: 24px; background: var(--k-accent); margin-left: 2px; }
    #chrome-track { position: absolute; left: 20px; right: 24px; bottom: 7px; height: 4px; background: var(--k-line); border-radius: 2px; }
    #chrome-fill { position: absolute; inset: 0; background: var(--k-accent); transform-origin: 0 50%; border-radius: 2px; }
    #chrome-rate { position: absolute; right: 36px; top: 30px; display: flex; align-items: baseline; gap: 14px; padding: 10px 22px 12px; background: var(--k-paper);
      border: 2px solid var(--k-accent-2); color: var(--k-ink); white-space: nowrap; }
    #chrome-rate-label { font: 500 16px/1 var(--k-font-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--k-muted); }
    #chrome-rate-value { font: 400 40px/1 var(--k-font-display); letter-spacing: 0.01em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
    #chrome-rate-unit { font: 500 18px/1 var(--k-font-mono); color: var(--k-muted); text-transform: lowercase; }
    #chrome-rate.off #chrome-rate-value { color: var(--k-accent-3); }
    #chrome-spin { width: 24px; height: 24px; border-radius: 50%; border: 4px solid var(--k-line); border-top-color: var(--k-accent); align-self: center; display: none; }
    #chrome-rate.buf #chrome-spin { display: block; }
  </style>
  <div id="root" data-composition-id="chrome" data-width="1920" data-height="1080">
    <div id="chrome-pill"><span id="chrome-dot"></span><span id="chrome-text"></span><span id="chrome-cursor"></span><span id="chrome-track"><span id="chrome-fill"></span></span></div>
    <div id="chrome-rate"><span id="chrome-rate-label">bitrate</span><span id="chrome-spin"></span><span id="chrome-rate-value"></span><span id="chrome-rate-unit"></span></div>
  </div>
  <script>
    (() => {
      const all = document.querySelectorAll('[data-composition-id="chrome"]'), root = all[all.length - 1];
      const $ = s => root.querySelector(s), FILM = window.FILM, off = FILM.offset || 0;
      const dur = FILM.span;
      const tl = gsap.timeline({ paused: true });
      const at = id => FILM.scenes[id].start, exportAt = K.exportAt(), endCard = at('s67');
      // the bitrate counter's story, keyed to scenes and one sung word
      const states = [[0, 'kbps', 128], [at('s05'), 'kbps', 320], [at('s19'), 'kbps', 1411], [at('s26'), 'text', 'FLAC 24/96'],
        [K.wordTime('s29', 'v2_1', 'locked'), 'off', 'offline'], [at('s34'), 'text', 'FLAC 24/96'], [at('s48'), 'buf', 'buffering'], [at('s50'), 'text', 'FLAC 24/96']];
      const pill = $('#chrome-pill'), text = $('#chrome-text'), fill = $('#chrome-fill'), cursor = $('#chrome-cursor'), dot = $('#chrome-dot');
      const rate = $('#chrome-rate'), value = $('#chrome-rate-value'), unit = $('#chrome-rate-unit'), spin = $('#chrome-spin');
      const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
      function render(T) {
        // pill: appears on the EXPORT click, fills with the song, ends on the end card
        const shown = T >= exportAt, p = Math.min(1, Math.max(0, (T - exportAt) / (endCard - exportAt)));
        const pop = ease((T - exportAt) / 0.25);
        pill.style.opacity = shown ? 1 : 0;
        pill.style.transform = `scale(${shown ? 0.85 + 0.15 * pop : 0.85})`;
        text.textContent = T >= endCard ? 'encoded. 0 bits lost.' : `encoding abhinav.wav... ${Math.floor(p * 100)}%`;
        fill.style.transform = `scaleX(${T >= endCard ? 1 : p})`;
        cursor.style.opacity = T >= endCard || Math.floor(T / 0.5) % 2 === 0 ? 1 : 0;
        dot.style.opacity = T >= endCard ? 1 : 0.55 + 0.45 * (Math.floor(T / 0.25) % 2);
        // counter
        let i = 0; while (i + 1 < states.length && states[i + 1][0] <= T) i++;
        const [t0, kind, v] = states[i], prev = states[Math.max(0, i - 1)], since = T - t0;
        rate.className = kind === 'off' ? 'off' : kind === 'buf' ? 'buf' : '';
        if (kind === 'kbps') {
          const from = prev[1] === 'kbps' && i > 0 ? prev[2] : v, n = Math.round(from + (v - from) * ease(since / 0.6));
          value.textContent = String(n); unit.textContent = 'kbps';
        } else if (kind === 'buf') {
          value.textContent = 'buffering' + '.'.repeat(1 + Math.floor(since / 0.4) % 3); unit.textContent = '';
          spin.style.transform = `rotate(${Math.round(since * 400) % 360}deg)`;
        } else { value.textContent = v; unit.textContent = ''; }
        // a two-frame glitch on every change after the first
        const glitch = i > 0 && since < 2 / 30;
        rate.style.transform = glitch ? 'translateX(-10px) skewX(-8deg)' : 'none';
      }
      const ctl = { v: 0, t(v) { if (!arguments.length) return this.v; this.v = v; render(v + off); } };
      tl.fromTo(ctl, { t: 0 }, { t: dur, duration: dur, ease: 'none', lazy: false, immediateRender: true }, 0);
      window.__timelines['chrome'] = tl;
    })();
  </script>
</template>
