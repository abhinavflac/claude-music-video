<template>
  <style>
    #root { --k-paper: #F4EFE4; --k-surface: #FFFFFF; --k-ink: #171613; --k-on-surface: #171613; --k-muted: #6B655A; --k-line: #171613;
      --k-accent: #D62B1F; --k-accent-2: #1C1A17; --k-accent-3: #F0D9CE; --k-on-accent: #FBF8F1;
      --k-font-display: 'Fraunces', serif; --k-font-body: 'Newsreader', serif; --k-font-mono: 'Spline Sans Mono', monospace;
      --k-radius: 16px; --k-shadow: none;
      position: absolute; inset: 0; overflow: hidden; background: var(--k-paper); color: var(--k-ink); font-family: var(--k-font-body); }
    #s20-rules { position: absolute; inset: -40px; opacity: 0.1; background: repeating-linear-gradient(to bottom, transparent 0 51px, var(--k-line) 51px 53px); }
    #s20-cam { position: absolute; inset: 0; }
    #s20-sheet { position: absolute; left: 110px; top: 132px; width: 1700px; height: 830px; background: var(--k-surface); border: 3px solid var(--k-line);
      border-radius: var(--k-radius); box-shadow: var(--k-shadow); }
    #s20-head { position: absolute; left: 48px; right: 48px; top: 30px; display: flex; justify-content: space-between; font: 500 20px/1 var(--k-font-mono);
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--k-muted); }
    #s20-lyric { position: absolute; left: 48px; top: 170px; width: 900px; font: 900 150px/1.02 var(--k-font-display); letter-spacing: -0.035em; color: var(--k-on-surface); }
    #s20-panel { position: absolute; left: 1000px; top: 104px; width: 652px; }
    .s20-label { font: 500 20px/1 var(--k-font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--k-muted); margin-bottom: 14px; }
    #s20-select { position: relative; height: 84px; border: 3px solid var(--k-line); border-radius: var(--k-radius) var(--k-radius) 0 0; }
    .s20-cur { position: absolute; left: 24px; top: 0; height: 84px; display: flex; align-items: center; font: 600 34px/1 var(--k-font-body); color: var(--k-on-surface); white-space: nowrap; }
    #s20-caret { position: absolute; right: 26px; top: 34px; width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 14px solid var(--k-line); }
    #s20-list { border: 3px solid var(--k-line); border-top: 0; border-radius: 0 0 var(--k-radius) var(--k-radius); overflow: hidden; }
    .s20-opt { position: relative; display: flex; align-items: center; gap: 18px; height: 92px; padding: 0 24px; font: 500 36px/1 var(--k-font-body); color: var(--k-on-surface); }
    .s20-opt + .s20-opt { border-top: 2px solid var(--k-line); }
    .s20-wash { position: absolute; inset: 0; background: var(--k-accent); opacity: 0; }
    .s20-txt { position: relative; white-space: nowrap; }
    .s20-meta { position: relative; margin-left: auto; font: 500 20px/1 var(--k-font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--k-muted); }
    #s20-dele { position: absolute; left: 330px; top: 8px; width: 120px; height: 76px; overflow: visible; }
    #s20-note { position: absolute; left: 48px; top: 560px; width: 860px; padding-left: 22px; border-left: 6px solid var(--k-accent); font: 500 26px/1.5 var(--k-font-mono); color: var(--k-on-surface); }
    #s20-note-a, #s20-note-b { display: block; min-height: 1.5em; white-space: pre; }
    #s20-foot { position: absolute; left: 48px; right: 48px; bottom: 34px; display: flex; justify-content: space-between; font: 500 24px/1 var(--k-font-mono); color: var(--k-on-surface); }
    #s20-foot b { font-weight: 600; }
    #s20-none { background: var(--k-accent); color: oklch(from var(--k-accent) clamp(0, (0.62 - l) * 1000, 1) 0 0); padding: 4px 10px; }
    #s20-stamp { left: 1330px; top: 560px; font-size: 84px; }
  </style>
  <div id="root" data-composition-id="s20" data-width="1920" data-height="1080">
    <div id="s20-rules" data-bleed data-layout-ignore></div>
    <div id="s20-cam" data-layout-allow-overflow>
      <div id="s20-sheet">
        <div id="s20-head"><span>galley 04 · export-settings.proof</span><span>correction pass 1 of 1</span></div>
        <div id="s20-lyric"></div>
        <div id="s20-note"><span id="s20-note-a"></span><span id="s20-note-b"></span></div>
        <div id="s20-panel">
          <div class="s20-label">quality preset</div>
          <div id="s20-select"><span class="s20-cur" id="s20-cur-a">320 kbps · recommended</span><span class="s20-cur" id="s20-cur-b">lossless · FLAC 24/96</span><span id="s20-caret"></span></div>
          <div id="s20-list">
            <div class="s20-opt"><span class="s20-txt">128 kbps</span><span class="s20-meta">small</span></div>
            <div class="s20-opt" id="s20-o320"><span class="s20-wash"></span><span class="s20-txt">320 kbps<span class="k-strike" id="s20-x320"></span></span><span class="s20-meta">recommended</span></div>
            <div class="s20-opt" id="s20-osm"><span class="s20-wash"></span><span class="s20-txt">smooth<span class="k-strike" id="s20-xsm"></span></span><span class="s20-meta">AI enhance</span></div>
            <div class="s20-opt" id="s20-ofl"><span class="s20-wash"></span><span id="s20-chk"></span><span class="s20-txt">lossless</span><span class="s20-meta">FLAC 24/96</span></div>
          </div>
        </div>
        <div id="s20-foot"><span>compression attempts: <b id="s20-n">0</b></span><span>passed: <span id="s20-none">none of them</span></span></div>
      </div>
    </div>
    <div class="k-stamp" id="s20-stamp" data-layout-allow-occlusion data-layout-allow-overlap>not me</div>
  </div>
  <script>
    (() => {
      const id = 's20', S = window.FILM.scenes[id], root = K.root(id), $ = s => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const L = S.lines[0], at = re => L.words.findIndex(w => re.test(w.w));
      const i320 = at(/^320/), ism = at(/^smooth/), w320 = L.words[i320], wsm = L.words[ism], end = L.end;

      // camera: the proof sheet drifts and pushes the whole shot
      gsap.set($('#s20-sheet'), { rotation: -1.4, transformOrigin: '50% 50%' });
      tl.to($('#s20-sheet'), { rotation: -0.5, duration: S.dur, ease: 'none' }, 0);
      K.push(tl, $('#s20-cam'), S.dur, 1, 1.045);
      tl.fromTo($('#s20-rules'), { y: 0 }, { y: -26, duration: S.dur, ease: 'none' }, 0);

      // the lyric, set as the proof's headline; 320 carries the highlight
      const { spans } = K.words($('#s20-lyric'), L, { key: i320, breakBefore: [i320 + 1] });
      K.reveal(tl, spans, L, 'rise');

      // redline pass: strike each preset on its sung word
      tl.to($('#s20-o320 .s20-wash'), { opacity: 0.12, duration: 0.08 }, w320.t);
      K.strikeAt(tl, $('#s20-x320'), w320.t + 0.05);
      K.count(tl, $('#s20-n'), 0, 1, w320.t, w320.t + 0.2, v => String(Math.round(v)));
      const dele = K.svg('svg', { id: 's20-dele', viewBox: '0 0 120 76' }, $('#s20-o320'));
      const mark = K.svg('path', { d: 'M4 60 C 30 58, 60 20, 84 14 C 104 10, 112 30, 96 40 C 82 48, 74 30, 90 22 C 100 18, 110 20, 116 24', fill: 'none',
        stroke: 'var(--k-accent)', 'stroke-width': 6, 'stroke-linecap': 'round', pathLength: 1 }, dele);
      gsap.set(mark, { strokeDasharray: 1, strokeDashoffset: 1 });
      tl.to(mark, { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' }, w320.t + 0.12);

      tl.to($('#s20-osm .s20-wash'), { opacity: 0.12, duration: 0.08 }, wsm.t);
      K.strikeAt(tl, $('#s20-xsm'), wsm.t + 0.04);
      K.slam(tl, $('#s20-stamp'), wsm.t + 0.1, -9);
      K.shake(tl, $('#s20-cam'), wsm.t + 0.25, 12, 3);

      // then the one preset left standing
      const chk = K.check($('#s20-chk'));
      tl.to($('#s20-ofl .s20-wash'), { opacity: 0.12, duration: 0.12 }, end + 0.12);
      K.tick(tl, chk, end + 0.16);
      tl.to($('#s20-cur-a'), { opacity: 0, y: -18, duration: 0.14 }, end + 0.3);
      tl.fromTo($('#s20-cur-b'), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.16, ease: 'power3.out' }, end + 0.34);

      // a proofreader's query in the margin, for the second watch
      K.type(tl, $('#s20-note-a'), 'query to author: ok to shave the highs for size?', w320.t + 0.3, w320.t + 1.1);
      K.type(tl, $('#s20-note-b'), 'author: no.', end + 0.2, end + 0.45);

      K.slabIn(root, tl);
      window.__timelines[id] = tl;
    })();
  </script>
</template>
