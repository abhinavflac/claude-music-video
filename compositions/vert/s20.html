      const id = 's20', S = window.FILM.scenes[id], root = K.root(id), $ = s => root.querySelector(s);

      tl.to($('#s20-o320 .s20-wash'), { opacity: 0.12, duration: 0.08 }, w320.t);
      K.strikeAt(tl, $('#s20-x320'), w320.t + 0.05);
      K.count(tl, $('#s20-n'), 0, 1, w320.t, w320.t + 0.2, v => String(Math.round(v)));
